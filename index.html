  <style>/* Art Museum, version 3: the white museum you walk through (Wednesday November 11 2026).
   Extends version 2's white look: white walls, a pale travertine floor, soft ceiling light, serif titles in near
   black, thin gold and grey lines only. One room at a time; the walk bar at the bottom moves between rooms. */
:root {
  color-scheme: light;
  --wall: #ffffff;
  --floor: #f6f3ee;
  --stone: #ece8e1;
  --ink: #1c1c1e;
  --muted: #55534e;
  --quiet: #6d6a64;
  --line: rgba(28, 28, 30, .13);
  --gold: #8a6a2e;
  --goldline: #c8a862;
  --page: min(1100px, calc(100% - 40px));
  --walkbar: 64px;
}
* { box-sizing: border-box; }
html { max-width: 100%; background: var(--wall); overflow-x: hidden; }
body { margin: 0; max-width: 100%; min-width: 0; background: var(--wall); color: var(--ink); overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.55;
  padding-bottom: calc(var(--walkbar) + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: rgba(200, 168, 98, .25); }
img { display: block; max-width: 100%; }
button, a, input, select, textarea { font: inherit; }
[hidden] { display: none !important; }
h1, h2, h3, p { overflow-wrap: anywhere; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: -.02em; color: var(--ink); margin: 0; }
h1 { font-size: clamp(2.3rem, 7vw, 5rem); line-height: 1; }
h2 { font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.05; }
.eyebrow { margin: 0 0 10px; color: var(--gold); font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
.lede { max-width: 620px; margin: 16px 0 0; color: var(--muted); font-size: clamp(1.02rem, 1.6vw, 1.18rem); }
.hint { margin: 10px 0 0; color: var(--muted); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }  /* --gold is 5:1 on white; the pale gold line was 2.3:1 (review Wednesday November 11 2026) */
.skip-link { position: absolute; left: -9999px; top: 10px; z-index: 40; padding: 10px 14px; background: var(--ink); color: #fff; }
.skip-link:focus-visible { position: fixed; left: 10px; }
.skip-link { color: var(--wall); }   /* dark theme: ink is light, so the text must be the dark wall colour (was 1.24:1) */

/* header */
.site-header { width: var(--page); margin: 0 auto; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-top: env(safe-area-inset-top); }
.museum-name { font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; color: inherit; text-decoration: none; white-space: nowrap; }
.museum-name::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 10px; border: 1px solid var(--goldline); transform: rotate(45deg) translateY(-2px); }
.plan-button { min-height: 44px; padding: 8px 2px; border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; text-decoration-color: var(--goldline); text-underline-offset: 6px; }
main { display: block; }
main:focus { outline: none; }

/* buttons */
.button-row, .ask-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; align-items: center; }
.button { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border: 1px solid var(--line);
  background: var(--wall); color: var(--ink); text-decoration: none; cursor: pointer; border-radius: 0; }
.button:hover { border-color: var(--ink); }
.button:disabled { opacity: .45; cursor: default; }
.button.primary { border-color: var(--ink); letter-spacing: .04em; box-shadow: inset 0 -2px 0 var(--goldline); }
.button.primary:hover:not(:disabled) { background: var(--floor); }
.button.quiet { border-color: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 5px; background: none; }

/* walking between rooms */
.area { animation: none; }
.area.from-right { animation: walk-in-right .42s cubic-bezier(.2, .7, .2, 1); }
.area.from-left { animation: walk-in-left .42s cubic-bezier(.2, .7, .2, 1); }
@keyframes walk-in-right { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes walk-in-left { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
.walkbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  min-height: calc(var(--walkbar) + env(safe-area-inset-bottom)); padding: 0 8px env(safe-area-inset-bottom);
  background: rgba(255, 255, 255, .96); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.walk { min-height: 52px; min-width: 52px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 0; background: none; color: var(--ink); cursor: pointer; overflow: hidden; }
.walk span { font-size: 2rem; line-height: 1; color: var(--gold); }
.walk em { font-style: normal; font-family: Georgia, serif; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.walk.next { justify-content: flex-end; text-align: right; }
.walk:disabled { visibility: hidden; }
.dots { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; max-width: 40vw; }
.dots i { width: 7px; height: 7px; border: 1px solid var(--goldline); transform: rotate(45deg); }
.dots i.on { background: var(--goldline); }

/* entrance */
.hero { margin: 0; background: var(--floor); }
.hero img { width: 100%; aspect-ratio: 16 / 8; max-height: 62svh; object-fit: cover; }
.hero-copy { width: var(--page); margin: 0 auto; padding: 32px 0 40px; }

/* a room: the wall with the paintings, the floor, then the desk with the one prompt box */
.wall { position: relative; padding: 26px 0 120px; min-height: min(68svh, 640px); overflow: hidden;
  background: radial-gradient(ellipse 70% 45% at 50% -8%, #fffaf0 0%, rgba(255, 250, 240, 0) 70%), linear-gradient(#fbfaf8, #ffffff 30%, #fdfcfa 100%);
  border-top: 1px solid var(--line); }
.wall-head { width: var(--page); margin: 0 auto 26px; }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: linear-gradient(#ebe5da, #f5f1ea 60%, #f8f5f0);
  border-top: 1px solid #ddd5c6; box-shadow: 0 -6px 0 #f7f5f1, 0 -7px 0 #e7e1d6; }
.hang { position: relative; z-index: 1; width: var(--page); margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 34px 44px; }
.painting { width: clamp(140px, 27vw, 300px); padding: 0; border: 0; background: none; cursor: zoom-in; color: inherit; text-align: center; }
.hang.single .painting { width: clamp(220px, 46vw, 460px); }
.frame { display: block; padding: 7px; background: linear-gradient(135deg, #e7d9b8, #c9b07a 45%, #e9dcbd); box-shadow: 0 26px 30px -20px rgba(40, 30, 10, .45), 0 2px 4px rgba(0, 0, 0, .08); }
.mat { display: block; padding: clamp(8px, 2vw, 18px); background: #fff; }
.mat img { width: 100%; height: auto; aspect-ratio: auto; background: var(--floor); }
.wall-label { display: block; margin: 16px auto 0; max-width: 220px; padding: 8px 10px; background: #fff; border: 1px solid var(--line); font-size: .86rem; color: var(--muted); }
.wall-label strong { display: block; font-family: Georgia, serif; font-weight: 400; font-size: 1rem; color: var(--ink); }
.empty-canvas { width: min(240px, 52vw); aspect-ratio: 4 / 5; border: 1px solid var(--goldline); outline: 1px solid var(--line); outline-offset: 12px; background: #fff;
  box-shadow: 0 18px 26px -16px rgba(0, 0, 0, .14); }
.wall-wait { flex-basis: 100%; text-align: center; margin: 22px 0 0; color: var(--muted); font-style: italic; font-family: Georgia, serif; font-size: 1.1rem; }

.desk { width: var(--page); margin: 0 auto; padding: 28px 0 56px; }
.ask { padding: 20px; border: 1px solid var(--line); background: #fff; box-shadow: 0 1px 0 var(--goldline); }
.ask-label { display: grid; gap: 8px; }
.ask-label span { font-family: Georgia, serif; font-size: 1.3rem; }
.ask textarea { width: 100%; min-height: 96px; padding: 12px; border: 1px solid var(--goldline); border-radius: 0; background: #fff; color: var(--ink); font-size: 16px; line-height: 1.45; resize: vertical; }
.ask textarea:focus { outline: 1px solid var(--goldline); }
.ai-pick { margin: 16px 0 0; padding: 0; border: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.ai-pick legend { padding: 0; margin-bottom: 8px; color: var(--muted); font-size: .92rem; }
.ai-chip { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 14px; border: 1px solid var(--line); cursor: pointer; background: #fff; }
.ai-chip input { width: 20px; height: 20px; margin: 0; accent-color: var(--gold); }
.ai-chip:has(input:checked) { border-color: var(--goldline); background: #fffcf5; }
.status { min-height: 1.4em; margin: 12px 0 0; color: var(--gold); }

.requests { display: grid; gap: 18px; margin-top: 20px; }
.request { padding: 18px 20px; border: 1px solid var(--line); background: #fff; }
.req-prompt { margin: 0; font-family: Georgia, serif; font-size: 1.12rem; }
.req-when { margin: 4px 0 0; color: var(--quiet); font-size: .88rem; }
.ai-rows { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.ai-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.ai-name { min-width: 150px; }
.pill { display: inline-block; padding: 2px 10px; border: 1px solid var(--line); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pill.drawing { border-color: var(--goldline); color: var(--gold); animation: breathe 1.6s ease-in-out infinite; }
.pill.done { border-color: #7c9a6b; color: #3f6a2f; }
.pill.failed { border-color: #c48a7a; color: #8a3a26; }
@keyframes breathe { 50% { background: #fff6e2; } }
.ai-note { flex-basis: 100%; color: var(--quiet); font-size: .88rem; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 260px)); gap: 14px; margin-top: 14px; }
.cand { padding: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; text-align: center; color: var(--muted); }
.cand img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--floor); }
.cand span { display: block; margin-top: 8px; font-size: .9rem; }
.cand[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--goldline); color: var(--ink); }
.cand.gone { opacity: .4; }
.drawer { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; }
.drawer summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--muted); }
.drawer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 10px; }
.drawer-grid figure { margin: 0; }
.drawer-grid img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; filter: saturate(.85); }
.drawer-grid figcaption { font-size: .82rem; color: var(--quiet); margin-top: 4px; }

/* dialogs */
dialog { padding: 0; border: 1px solid var(--line); background: #fff; color: var(--ink); }
dialog::backdrop { background: rgba(246, 243, 238, .93); }
dialog.plan { width: min(520px, calc(100% - 24px)); }
.plan-inner { padding: 22px; }
.plan ol { list-style: none; margin: 16px 0; padding: 0; display: grid; gap: 8px; }
.plan ol button { width: 100%; min-height: 56px; display: grid; gap: 2px; padding: 10px 14px; text-align: left; border: 1px solid var(--line); background: #fff; cursor: pointer; color: inherit; }
.plan ol button strong { font-family: Georgia, serif; font-weight: 400; font-size: 1.1rem; }
.plan ol button span { color: var(--quiet); font-size: .9rem; }
.plan ol button.here { border-color: var(--goldline); background: #fffcf5; }
dialog.viewer { width: min(980px, calc(100% - 24px)); max-height: calc(100svh - 24px); }
.viewer-stage { background: var(--floor); padding: 16px; }
.viewer-stage img { width: 100%; max-height: 62svh; object-fit: contain; }
.viewer-copy { padding: 18px; }
.viewer-copy p { color: var(--muted); margin: 8px 0 0; }
.viewer-copy .button { margin-top: 14px; }

@media (max-width: 640px) {
  :root { --page: calc(100% - 32px); }
  .hero img { aspect-ratio: 4 / 3; }
  .hang { gap: 26px 18px; }
  .painting { width: calc(50% - 10px); }
  .hang.single .painting { width: min(78vw, 360px); }
  .wall { padding-bottom: 104px; min-height: 0; }
  .wall-head { margin-bottom: 22px; }
  .ask { padding: 16px; }
  .ai-chip { flex: 1 1 100%; }
  .walk em { max-width: 26vw; font-size: .9rem; }
}
/* a laptop sees Walk in on the first screen: the entrance photo stops at 46% of the height (Gemini and ChatGPT review, Wednesday November 11 2026) */
@media (min-width: 641px) { .hero img { max-height: 46svh; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Wednesday November 11 2026: live steps, seconds, Peek, out of pictures labels, links to the AIs */
.ai-step { color: var(--muted); font-size: .88rem; }
.ai-step b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.link { background: none; border: 0; padding: 4px 2px; min-height: 32px; color: var(--gold); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; font-size: .9rem; }
.peek-thumb { flex-basis: 100%; display: flex; align-items: center; gap: 10px; padding: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--muted); font: inherit; font-size: .85rem; text-align: left; }
.peek-thumb img { width: 120px; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; background: var(--floor); }
dialog.peek { width: min(920px, 94vw); padding: 0; border: 1px solid var(--line); background: #fff; }
dialog.peek::backdrop { background: rgba(30, 28, 24, .45); }
.peek-inner { padding: 18px; display: grid; gap: 12px; }
.peek-inner h2 { margin: 0; font-size: 1.2rem; }
.peek-inner img { width: 100%; max-height: 70vh; object-fit: contain; border: 1px solid var(--line); background: var(--floor); }
.peek-inner p { margin: 0; color: var(--muted); }
.ai-cap { display: block; font-size: .72rem; color: #8a3a26; letter-spacing: 0; }
.ai-cap:empty { display: none; }
.ai-chip.capped span { text-decoration: line-through; text-decoration-color: rgba(138, 58, 38, .5); }
.ai-links { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }
.ai-links a { color: var(--gold); }

/* Wednesday November 11 2026, phone walkthrough: real room walls (AI drawn), a compact AI picker, a picture on the floor plan */
.has-wall .wall { background: linear-gradient(rgba(255, 255, 255, .30), rgba(255, 255, 255, .10) 60%, rgba(255, 255, 255, 0)), var(--wall-img) center bottom / cover no-repeat, #fbfaf8; }
.has-wall .wall.open { background: linear-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, .25)), var(--arch-img, var(--wall-img)) center / cover no-repeat, #fbfaf8; }
.has-wall .floor { background: linear-gradient(rgba(248, 245, 240, 0), rgba(248, 245, 240, .85)); border-top: 0; box-shadow: none; }
.has-wall .wall-head h1, .has-wall .wall-head .eyebrow { text-shadow: 0 1px 12px rgba(255, 255, 255, .9); }
.plan-img { display: block; width: 100%; height: 120px; object-fit: cover; }
.plan-img:not([src]) { display: none; }
.has-emblem .museum-name::before { width: 26px; height: 26px; margin-right: 8px; border: 0; transform: none; vertical-align: -6px; background: var(--emblem-img) center / contain no-repeat; mix-blend-mode: multiply; }
@media (max-width: 640px) {
  .ai-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ai-pick legend { grid-column: 1 / -1; }
  .ai-chip { min-height: 44px; padding: 8px 10px; gap: 8px; font-size: .95rem; }
  .wall { padding-bottom: 72px; }
  .floor { height: 64px; }
}

/* Wednesday November 11 2026, Karim: "not minimalist and cluttered with options and suboptions" */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ask textarea { width: 100%; min-height: 0; resize: vertical; }
.ask-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
.ask-bar .ai-pick, .has-wall .ask-bar .ai-pick { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; grid-template-columns: none; }
.ask-bar .ai-chip { position: relative; min-height: 36px; padding: 6px 12px; gap: 6px; border-radius: 999px; font-size: .9rem; flex: 0 0 auto; }
.ask-bar .ai-chip input { appearance: none; -webkit-appearance: none; width: 9px; height: 9px; border: 1px solid var(--goldline); border-radius: 50%; }
.ask-bar .ai-chip input:checked { background: var(--gold); border-color: var(--gold); }
.ask-bar .ai-cap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ask-bar .ai-chip.capped { opacity: .45; }
.ask-bar .ai-chip.capped span { text-decoration: none; }
.ask-bar [data-send] { margin-left: auto; }
.request .req-prompt { display: flex; gap: 10px; align-items: baseline; font-size: 1rem; }
.request .req-prompt span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.request .req-prompt time { color: var(--quiet); font-size: .8rem; }
.ai-rows { gap: 6px; margin-top: 8px; }
.ai-row { flex-wrap: wrap; gap: 4px 10px; font-size: .92rem; }
.ai-name { min-width: 64px; }
.pill { padding: 1px 8px; font-size: .72rem; }
.why { flex-basis: 100%; font-size: .85rem; color: var(--quiet); }
.why summary { cursor: pointer; color: var(--muted); list-style: none; display: inline; text-decoration: underline; text-underline-offset: 3px; }
.why summary::-webkit-details-marker { display: none; }
.why p { margin: 4px 0; }
@media (max-width: 640px) {
  .ask-bar { gap: 8px; }
  .ask-bar [data-send] { flex: 1 1 100%; }
}

/* Thursday November 12 2026, 375 px walkthrough: the request card ran past the right edge (its time was cut), and the
   four AI pills took two rows */
.requests { grid-template-columns: minmax(0, 1fr); }
.request, .request .req-prompt span { min-width: 0; }
@media (max-width: 640px) {
  .request { padding: 14px; }
  .ask-bar .ai-pick { gap: 5px; flex-wrap: nowrap; }
  .ask-bar .ai-chip { padding: 5px 9px; gap: 5px; font-size: .84rem; min-height: 34px; }
}

/* Thursday November 12 2026: the viewer walks through the room (swipe, arrows) */
.view-nav { display: flex; align-items: center; gap: 12px; margin: 4px 0 0; color: var(--quiet); font-size: .85rem; }
.view-nav:empty { display: none; }
.view-nav .link { font-size: 1.4rem; line-height: 1; text-decoration: none; padding: 2px 8px; }

/* Thursday November 12 2026: the empty canvas is a button to the prompt box */
button.empty-canvas { display: block; padding: 0; cursor: pointer; font: inherit; }
button.empty-canvas:hover, button.empty-canvas:focus-visible { box-shadow: 0 0 0 2px var(--goldline); }

/* Thursday November 12 2026: a small picture of each room in the floor plan */
.plan ol button.has-thumb { grid-template-columns: 52px 1fr; column-gap: 12px; align-items: center; }
.plan ol button.has-thumb .plan-thumb { grid-row: span 2; width: 52px; height: 52px; object-fit: cover; border: 1px solid var(--goldline); }
/* Thursday November 12 2026, desktop check: the portrait wall picture showed mostly floor on a wide screen and the
   painting sat on the skirting board; on wide screens the picture is placed higher so the wall face is behind the art */
@media (min-width: 900px) { .has-wall .wall:not(.open) { background-position: center 32%; } }

/* Thursday November 12 2026 (Gemini review): a faded pill says when that AI can draw again */
.ask-bar .ai-chip.capped[data-until]::after { content: attr(data-until); font-size: .7rem; color: #8a3a26; margin-left: 2px; }

/* QA fresh eyes, Thursday November 12 2026: one Best available pill, the AIs behind Choose AIs; one main and one outline
   button style; the empty frame says what to do; room for the bottom bar */
.ai-more { flex: 1 1 100%; order: 2; }
.ai-more summary { cursor: pointer; color: var(--muted); font-size: .85rem; text-decoration: underline; text-underline-offset: 4px; list-style: none; display: inline-block; padding: 4px 0; }
.ai-more summary::-webkit-details-marker { display: none; }
.ai-more[open] .ai-pick { margin-top: 8px; }
.ask-bar .ai-chip.best { order: 0; }
.ask-bar [data-send] { order: 1; }
.button { background: #fff; border: 1px solid var(--ink); color: var(--ink); box-shadow: none; }
.button.primary { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: none; }
.button.primary:hover:not(:disabled) { background: #3a362f; }
button.empty-canvas { border: 1.5px dashed var(--goldline); outline: none; background: rgba(255, 255, 255, .55); display: flex; align-items: center; justify-content: center; }
button.empty-canvas span { font-family: Georgia, serif; font-size: 1.15rem; color: var(--ink); }

/* QA round 2, Thursday November 12 2026: back at HH:MM on a resting AI, 40 px targets, room above the bottom bar,
   today's painting on the entrance, and a dark theme that follows the phone */
.ask-bar .ai-chip.capped[data-until]::after { content: attr(data-until); font-size: .72rem; color: var(--quiet); margin-left: 4px; }
.ask-bar .ai-chip.capped { cursor: not-allowed; }
.ask-bar .ai-chip, .ask-bar .ai-chip.best { min-height: 40px; }
.ai-more summary { min-height: 40px; display: inline-flex; align-items: center; padding: 0 4px; }
main { padding-bottom: 112px; }
.today { display: flex; align-items: center; gap: 14px; margin-top: 22px; padding: 8px; width: 100%; max-width: 360px; border: 1px solid var(--line); background: var(--card, #fff); cursor: pointer; text-align: left; font: inherit; color: var(--ink); }
.today img { width: 84px; height: 64px; object-fit: cover; border: 3px solid #fff; outline: 1px solid var(--goldline); }
.today span { display: grid; gap: 2px; font-family: Georgia, serif; font-size: 1.02rem; }
.today small { font-family: inherit; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
@media (prefers-color-scheme: dark) {
  :root { --wall: #15130f; --floor: #1c1915; --stone: #26221c; --ink: #ece6da; --muted: #bdb5a6; --quiet: #a39b8c; --line: rgba(236, 230, 218, .16);
          --gold: #d2b06a; --goldline: #8f7640; --card: #1d1a16; color-scheme: dark; }
  .ask, .request, .cand, .wall-label, dialog, dialog.peek, .plan ol button, .peek-thumb, .ai-chip, .ask textarea, .button, .today { background: var(--card); color: var(--ink); }
  .ai-chip:has(input:checked), .plan ol button.here { background: #2a251d; }
  .button { border-color: var(--ink); }
  .button.primary { background: var(--ink); color: #15130f; }
  .has-wall .wall { background: linear-gradient(rgba(21, 19, 15, .55), rgba(21, 19, 15, .35) 60%, rgba(21, 19, 15, .2)), var(--wall-img) center bottom / cover no-repeat, #15130f; }
  .has-wall .wall.open { background: linear-gradient(rgba(21, 19, 15, .6), rgba(21, 19, 15, .45)), var(--arch-img, var(--wall-img)) center / cover no-repeat, #15130f; }
  .has-wall .wall-head h1, .has-wall .wall-head .eyebrow { text-shadow: 0 1px 12px rgba(0, 0, 0, .7); }
  .has-wall .floor { background: linear-gradient(rgba(21, 19, 15, 0), rgba(21, 19, 15, .85)); }
  .mat { background: #f4efe6; }
  .walkbar, .site-header { background: rgba(21, 19, 15, .94); }
  button.empty-canvas { background: rgba(21, 19, 15, .5); }
  .has-emblem .museum-name::before { mix-blend-mode: screen; filter: invert(1) hue-rotate(180deg) brightness(1.1); }
}

/* Thursday November 12 2026: all paintings at the end of the floor plan */
.plan-all h3 { font-size: 1rem; margin: 6px 0 10px; color: var(--muted); font-family: Georgia, serif; }
.plan-all:empty { display: none; }
.all-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-bottom: 14px; }

.all-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Thursday November 12 2026, fresh review at 375 x 812: dark backdrop, aligned Choose AIs, no empty tail under the box,
   arrows level with the room names, an even left edge in the floor plan */
@media (prefers-color-scheme: dark) { dialog::backdrop { background: rgba(10, 9, 7, .82); } }
.ai-more summary { padding: 0; }
main { padding-bottom: 0; }
.desk { padding-bottom: 32px; }
.walk span { font-size: 1.6rem; line-height: 1; transform: translateY(-3px); }
.plan ol button:not(:has(img)) { grid-template-columns: 52px 1fr; column-gap: 12px; align-items: center; }
.plan ol button:not(:has(img))::before { content: ""; grid-row: span 2; width: 52px; height: 52px; border: 1px solid var(--line); box-sizing: border-box; }
@media (prefers-color-scheme: dark) { .button.primary:hover:not(:disabled) { background: #d9d1c2; color: #15130f; } }
/* Thursday November 12 2026, Gemini, ChatGPT and Claude agreed: on a phone the box, Paint and Choose AIs show above the
   bottom bar the moment a room opens; 44 px targets for the AI pills and the pager */
@media (max-width: 640px) {
  .wall { padding-bottom: 20px; }
  .floor { height: 20px; }
  .wall-head { margin-bottom: 14px; }
  .desk { padding-top: 12px; }

  .hang.single .painting { width: min(70vw, 320px); }

}
.ask-bar .ai-chip, .ask-bar .ai-chip.best, .ai-more summary { min-height: 44px; }
.walk { min-height: 44px; }

/* Thursday November 12 2026: Remove with a 10 s Undo bar above the bottom bar */
.undo-bar { position: fixed; left: 12px; right: 12px; bottom: calc(var(--walkbar) + 12px + env(safe-area-inset-bottom)); z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--ink); color: var(--wall); font-size: .92rem; }
.undo-bar[hidden] { display: none; }
.undo-bar .link { color: var(--goldline); min-height: 40px; }
[data-remove] { margin-left: auto; }

/* G5, Thursday November 12 2026: the painting opens full screen at full resolution */
dialog.viewer { width: 100vw; max-width: 100vw; height: 100svh; max-height: 100svh; margin: 0; border: 0; background: #0f0e0c; color: #ece6da;
  display: none; grid-template-rows: 1fr auto; }
dialog.viewer[open] { display: grid; }
dialog.viewer::backdrop { background: #0f0e0c; }
.viewer-stage { background: #0f0e0c; padding: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; min-height: 0; }
.viewer-stage img { width: 100%; height: 100%; max-height: none; object-fit: contain; transform-origin: center; transition: filter .3s; will-change: transform; }
.viewer-stage img.loading { filter: blur(8px); }
dialog.viewer .viewer-copy { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: #0f0e0c; }

dialog.viewer .button { background: transparent; color: #ece6da; border-color: #ece6da; min-height: 44px; margin-top: 8px; }
dialog.viewer .button.quiet { border-color: transparent; color: #bdb5a6; }
dialog.viewer .view-nav .link { color: #d2b06a; }

/* G6: the room name is a quiet button (tap to rename) */
.room-name { all: unset; cursor: pointer; font: inherit; color: inherit; }
.room-name:focus-visible { outline: 1px dashed var(--goldline); outline-offset: 4px; }

/* T7, Thursday November 12 2026 (Karim: landscape when viewing pictures; the picture takes most of the screen; a nice canvas
   rim): the viewer picture always fills the screen and the words float over it; one tap hides them */
dialog.viewer { grid-template-rows: 1fr; }
dialog.viewer .viewer-stage { grid-area: 1 / 1; height: 100svh; }
dialog.viewer .viewer-copy { grid-area: 1 / 1; align-self: end; z-index: 1; padding-top: 48px;
  background: linear-gradient(rgba(15, 14, 12, 0), rgba(15, 14, 12, .82) 38%, rgba(15, 14, 12, .94)); transition: opacity .2s; }
dialog.viewer.bare .viewer-copy { opacity: 0; pointer-events: none; }
@media (orientation: landscape) and (max-height: 520px) {
  dialog.viewer .viewer-copy { padding: 28px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); }
  dialog.viewer .viewer-copy [data-meta], dialog.viewer .viewer-copy [data-prompt-line] { display: none; }
  dialog.viewer .viewer-copy h2 { font-size: 1.05rem; }
  dialog.viewer .viewer-copy .ask-row { margin-top: 2px; }
  dialog.viewer .button { min-height: 40px; margin-top: 4px; padding: 6px 14px; }
  /* the room on its side: the room name on the left, the painting fills the height on the right */
  .site-header { min-height: 44px; }
  .wall { display: grid; grid-template-columns: minmax(150px, 28%) 1fr; align-items: center; column-gap: 12px; padding: 10px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); min-height: 0; }
  .wall-head { width: auto; margin: 0; }
  .wall-head h1 { font-size: 1.6rem; line-height: 1.15; }
  .hang { width: auto; flex-wrap: nowrap; overflow-x: auto; justify-content: center; gap: 22px; padding-bottom: 4px; }
  .painting, .hang.single .painting { width: auto; flex: none; }
  .mat { padding: 10px; }
  .painting .mat img { width: auto; height: calc(100svh - 56px - 22px - 20px - 40px - 34px - env(safe-area-inset-bottom)); max-width: 62vw; object-fit: contain; }
  .wall-label { margin-top: 6px; max-width: 260px; padding: 4px 8px; }
  .wall-label strong { display: inline; font-size: .9rem; } .wall-label span { margin-left: 6px; font-size: .78rem; }
  .floor { display: none; }
}
/* A7b: the pictures from 2 AIs sit side by side on a phone (they stacked at 375 and 414) */
.cands { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .cands { grid-template-columns: repeat(auto-fill, minmax(160px, 240px)); gap: 14px; } }
.cand { padding: 6px; }
/* T11: paint in a phone app, then add the picture */
.phone-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.phone-row .ai-chip { font: inherit; font-size: .9rem; cursor: pointer; }
.phone-apps .hint { margin: 8px 0 6px; font-size: .82rem; color: var(--muted); }
.add-pic { display: inline-flex; align-items: center; min-height: 44px; cursor: pointer; }
/* T7: a room on its side gives the header's height to the painting (Floor plan stays on the entrance) */
@media (orientation: landscape) and (max-height: 520px) { body[data-view="room"] .site-header { display: none; } }
/* phone check Thursday November 12 2026: iOS paints button text blue; the page scrolled under the clock and battery */
.phone-row .ai-chip { color: var(--ink); -webkit-appearance: none; appearance: none; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--wall, #fff); z-index: 60; pointer-events: none; }

/* T12: side by side. On a phone a room with several paintings is one sideways row that snaps painting to painting;
   in the viewer a swipe goes on into the next room and its name shows for a moment */
@media (max-width: 640px) and (orientation: portrait) {
  .hang.many { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    gap: 18px; padding: 0 11vw 6px; width: 100%; scrollbar-width: none; }
  .hang.many::-webkit-scrollbar { display: none; }
  .hang.many .painting { flex: none; width: 78vw; scroll-snap-align: center; }
}
dialog.viewer .room-tag { grid-area: 1 / 1; align-self: start; justify-self: center; z-index: 2; margin: calc(14px + env(safe-area-inset-top)) 0 0;
  padding: 6px 14px; background: rgba(15, 14, 12, .72); color: #d2b06a; font-family: Georgia, serif; font-size: 1rem; letter-spacing: .04em;
  opacity: 0; pointer-events: none; }
dialog.viewer .room-tag.show { animation: room-tag 1.8s ease forwards; }
@keyframes room-tag { 0%, 100% { opacity: 0; } 12%, 70% { opacity: 1; } }
.viewer-stage img.slide-l { animation: slide-l .22s ease-out; }
.viewer-stage img.slide-r { animation: slide-r .22s ease-out; }
@keyframes slide-l { from { opacity: .3; transform: translateX(40px); } }
@keyframes slide-r { from { opacity: .3; transform: translateX(-40px); } }
@media (max-width: 640px) and (orientation: portrait) { .hang.many .mat img { max-height: 48svh; object-fit: contain; } }

/* M7: Paste picture and Pick picture side by side */
.phone-apps .ask-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.phone-apps .ask-row .button { min-height: 44px; }
/* M5, Thursday November 12 2026 (Karim: "adjust the rim of the canvas so that its nice"): a gallery frame, a thin gold
   moulding with a fine inner line, a generous off white mat, the picture set in by a hairline, a soft shadow on the wall */
.frame { padding: 4px; background: linear-gradient(135deg, #e9dbb6, #b8975a 40%, #e6d4a8 60%, #a8874c);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 18px 28px -14px rgba(40, 30, 10, .35), 0 3px 8px rgba(40, 30, 10, .12); }
.mat { padding: clamp(14px, 4.2vw, 30px); background: #fbfaf6; box-shadow: inset 0 0 0 1px rgba(160, 130, 70, .35), inset 0 2px 6px rgba(0, 0, 0, .06); }
.mat img { box-shadow: 0 0 0 1px rgba(0, 0, 0, .10); }
@media (prefers-color-scheme: dark) { .mat { background: #f3efe6; } }
@media (orientation: landscape) and (max-height: 520px) { .mat { padding: 10px; } }

/* T10: the entrance says only what is needed */
.entrance-area .lede:empty { display: none; }

/* night QA: a close button always in the corner, a one time hint, a spinner while the full picture loads, the two step Remove */
dialog.viewer .viewer-x { grid-area: 1 / 1; align-self: start; justify-self: end; z-index: 3; margin: calc(8px + env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 0 0;
  width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(15, 14, 12, .55); color: #ece6da; font-size: 1.6rem; line-height: 1; cursor: pointer; }
dialog.viewer .viewer-hint { grid-area: 1 / 1; align-self: center; justify-self: center; z-index: 2; margin: 0; padding: 8px 14px; background: rgba(15, 14, 12, .72);
  color: #ece6da; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .4s; }
dialog.viewer .viewer-hint.show { opacity: 1; }
.viewer-stage { position: relative; }
.viewer-stage .spin { position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border: 2px solid rgba(236, 230, 218, .25);
  border-top-color: #d2b06a; border-radius: 50%; animation: spin 0.9s linear infinite; display: none; }
.viewer-stage img.loading + .spin { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
dialog.viewer [data-remove].armed { color: #e8a08c; text-decoration-color: #e8a08c; }

/* professional pass, Thursday November 12 2026: the rename sheet; calmer type on a phone; one gold accent; smooth room walks */
dialog.rename { border: 0; padding: 0; width: min(92vw, 420px); background: var(--card, #fff); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, .25); }
dialog.rename::backdrop { background: rgba(20, 18, 14, .45); }
.rename-inner { padding: 22px 20px 18px; display: grid; gap: 10px; }
.rename-inner h2 { font-size: 1.4rem; }
.rename-inner .hint { margin: 0; color: var(--muted); font-size: .88rem; }
.rename-inner input { font: inherit; font-size: 1.1rem; padding: 12px; border: 1px solid var(--goldline); background: var(--card, #fff); color: var(--ink); border-radius: 0; }
.rename-inner .ask-row { display: flex; gap: 10px; margin-top: 4px; }
@media (max-width: 640px) {
  .wall-head h1 { font-size: clamp(1.9rem, 8.4vw, 2.4rem); line-height: 1.08; }
  .eyebrow { font-size: .7rem; letter-spacing: .16em; font-weight: 600; margin-bottom: 6px; }
  .wall-label { font-size: .8rem; }
  .wall-label strong { font-size: .95rem; }
}
main > .area { will-change: transform, opacity; }
.from-right { animation: walk-in-right .32s cubic-bezier(.2, .7, .2, 1); }
.from-left { animation: walk-in-left .32s cubic-bezier(.2, .7, .2, 1); }

/* 4 hour run: on a phone the painting takes most of the width (Karim: "the pic should take most of the image") */
@media (max-width: 640px) and (orientation: portrait) {
  .hang.single .painting { width: min(88vw, 420px); }
  .hang.many .painting { width: 84vw; }
  .hang.many { padding: 0 8vw 6px; gap: 14px; }
  .hang.many .mat img { max-height: 54svh; }

}

/* night QA 9: in landscape the room eyebrow stays on one line */
@media (orientation: landscape) and (max-height: 520px) { .wall-head .feat-tag { display: none; } .wall-head .eyebrow { white-space: nowrap; } }
/* the sideways row centres each painting, so a tall neighbour leaves no empty wall above a wide one */
@media (max-width: 640px) and (orientation: portrait) { .hang.many { align-items: center; } }

/* frame options (FRAME_OPTIONS.png): B walnut with a linen mat, C a thin black float; A is the gold above */
html[data-frame="B"] .frame { padding: 9px; background: linear-gradient(135deg, #5a3d28, #3b2718 45%, #6b4a31 60%, #2e1e12);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 20px 30px -14px rgba(20, 12, 4, .45), 0 3px 8px rgba(20, 12, 4, .18); }
html[data-frame="B"] .mat { padding: clamp(16px, 4.6vw, 32px); background: #efe9dd; box-shadow: inset 0 0 0 1px rgba(90, 61, 40, .35), inset 0 3px 8px rgba(0, 0, 0, .08); }
html[data-frame="C"] .frame { padding: 3px; background: #161412; box-shadow: 0 22px 34px -16px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .2); }

/* landscape polish, Friday November 13 2026: the entrance shows Walk in above the bar; wall labels stay on one line */
@media (orientation: landscape) and (max-height: 520px) {

}
@media (orientation: landscape) and (max-height: 520px) {

  .hero-copy { display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 16px; padding-top: 10px; }
  .hero-copy .eyebrow, .hero-copy .lede { grid-column: 1; }
  .hero-copy h1 { grid-column: 1; font-size: 1.7rem; }

}

/* fresh-eyes review, Friday November 13 2026 (Sonnet): */
.walkbar { background: var(--wall, #fff); }                         /* 1: the bar is solid, nothing shows through */
@media (prefers-color-scheme: dark) { .walkbar { background: #15130f; } }
button.dots { border: 0; background: none; padding: 10px 8px; cursor: pointer; }   /* 2: the dots open the floor plan, also in landscape */
main .area.room-area { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }   /* 6: the last link clears the bar */
.wall-head .eyebrow { color: #6b5320; }                               /* 12: darker gold on the pale wall */
@media (prefers-color-scheme: dark) { .wall-head .eyebrow { color: #d2b06a; } }
.painting .mat img { background-color: #ece8e0; }                     /* 7: a warm tint while a picture loads */
/* 4: with the words showing in portrait, the painting sits in the space above them */
@media (orientation: portrait) {
  dialog.viewer:not(.bare) .viewer-stage { align-items: center; padding: calc(56px + env(safe-area-inset-top)) 0 min(320px, 40svh); }

}

/* review 11: the floor plan has a close button in its corner */
dialog.plan { position: fixed; }
dialog.plan .plan-x { position: absolute; top: 8px; right: 8px; z-index: 2; width: 40px; height: 40px; border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .85); color: #1c1c1e; font-size: 1.5rem; line-height: 1; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
/* review 9: on a phone the entrance fills the screen and Walk in is one wide button */
@media (max-width: 640px) and (orientation: portrait) {

@media (max-width: 640px) {
  .walk em { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.15; max-width: 32vw; font-size: .82rem; }
}
/* review 1: in landscape the painting takes the height; the label shows in the viewer instead */
@media (orientation: landscape) and (max-height: 520px) {
  .wall-label { display: none; }
  .painting .mat img { height: calc(100svh - 56px - 22px - 20px - 30px - env(safe-area-inset-bottom)); }
}

/* Friday November 13 2026: lighter ask box. One hairline field, no card around it, chip and Paint on one row,
   the two quiet links side by side under it. */
.ask { border: 0; box-shadow: none; background: transparent; padding: 4px 0 0; }
.ask textarea { border: 0; border-bottom: 1px solid var(--goldline); background: transparent; padding: 10px 2px; min-height: 64px; }

/* Friday November 13 2026, review 2 (fresh eyes): the floor plan banner is a slim strip and goes in landscape; the
   viewer keeps one close (the corner x); the painting arrows are full size taps; the landscape hint sits low. */
.plan-img { height: 64px; }
@media (orientation: landscape) and (max-height: 520px) { .plan-img { display: none !important; } }
dialog.viewer .ask-row [data-viewer-close] { display: none; }
.view-nav { gap: 4px; }
.view-nav .link { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
dialog.viewer.bare .viewer-hint { align-self: end; margin: 0 0 calc(16px + env(safe-area-inset-bottom)); background: rgba(15, 14, 12, .5); font-size: .8rem; }
/* review 2: landscape entrance in two columns, the building on the left at full height, the words and Walk in on the right */
@media (orientation: landscape) and (max-height: 520px) {
  .entrance-area { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100svh - 56px - var(--walkbar) - env(safe-area-inset-bottom)); }
  .entrance-area .hero { height: 100%; }
  .entrance-area .hero img { height: 100%; max-height: none; aspect-ratio: auto; }
  .entrance-area .hero-copy { width: auto; margin: 0; padding: 20px 28px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .entrance-area .hero-copy .button-row { width: 100%; margin-top: 14px; }
  .entrance-area .hero-copy .button-row .button.primary { width: 100%; }
}

/* review 3: on a wide screen the mat was thicker than the picture needs; the painting takes more of the frame */
@media (min-width: 900px) { .mat { padding: 14px; } .hang.many .painting { flex: 0 1 330px; } }
/* review 3: on a wide screen the whole painting sits above the caption, nothing is covered */
@media (min-width: 900px) and (min-height: 600px) { dialog.viewer:not(.bare) .viewer-stage { padding: 56px 40px 230px; box-sizing: border-box; } }
.plan ol button .plan-thumb:not([src]) { background: #f1eee8; }
.plan { max-width: 560px; }
/* review 3: on a wide screen the entrance fits one screen: shorter building, the words left, today's painting right */
@media (min-width: 900px) and (min-height: 560px) {
  .entrance-area .hero img { max-height: 40svh; }
  .entrance-area .hero-copy { display: grid; grid-template-columns: 1fr 360px; column-gap: 64px; align-items: center; padding: 28px 0 24px; }
  .entrance-area .hero-copy .eyebrow, .entrance-area .hero-copy h1, .entrance-area .hero-copy .lede, .entrance-area .hero-copy .button-row { grid-column: 1; }
  .entrance-area .hero-copy .today { grid-column: 2; grid-row: 1 / span 4; margin: 0; justify-self: end; }
  .entrance-area .hero-copy h1 { font-size: 3rem; }
}
/* review 5: every tap target is at least 44 px tall (audit on the live page) */
.dots { min-height: 44px; }
.museum-name { display: inline-flex; align-items: center; min-height: 44px; }
.room-name { min-height: 44px; }

/* outside review, Friday November 13 2026: plaque title wraps to two lines, never cut; Choose AIs pills wrap inside the
   box; the run lines fold behind one short status line (failures stay in the fold) */
.wall-label { white-space: normal !important; overflow: visible; text-overflow: clip; max-width: min(100%, 300px); overflow-wrap: anywhere; }
.wall-label strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; }
.ask-more .ai-pick, .ai-more .ai-pick, .ask-bar .ai-pick { flex-wrap: wrap !important; min-width: 0; max-width: 100%; }
.ai-more .ai-pick .ai-chip { flex: 0 1 auto; min-width: 0; max-width: 100%; white-space: nowrap; }
.ai-more .ai-pick .ai-chip.capped { flex: 1 1 100%; }
.ai-more .ai-pick .ai-chip.capped[data-until]::after { white-space: nowrap; }
details.runs { margin-top: 8px; }
details.runs > summary { cursor: pointer; list-style: none; color: var(--muted); font-size: .9rem; min-height: 40px; display: flex; align-items: center; gap: 8px; }
details.runs > summary::-webkit-details-marker { display: none; }
details.runs > summary u { text-underline-offset: 4px; color: var(--quiet); font-size: .8rem; }
details.runs[open] > summary { margin-bottom: 2px; }
.ask-bar .ai-more:not(.phone-apps)[open] ~ .ai-more.phone-apps { grid-row: 3; }
.ask-bar .ai-more.phone-apps[open] { grid-row: 3; }
/* outside review point 6: one close control on the floor plan (the X); the bottom Close stays in the page for keyboards only */
dialog.plan .plan-inner > .button[data-plan-close] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
/* outside review point 8: an occupied wall folds the painting form behind one button */
[data-ask-slot].folded form { display: none; }
[data-ask-slot] > .button.replace { margin: 12px 0 0; min-height: 44px; }
/* tap targets, Friday November 13 2026 (eyes scan): the pill dot is not the target, the whole 44 px pill is; plan X is 44 px */
.ask-bar .ai-chip, .ask-bar .ai-chip.best { min-height: 44px; }
dialog.plan .plan-x { width: 44px; height: 44px; }
/* A0734: coming back from another AI app, the Paste picture step is the one that glows */
.button.nudge { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200, 168, 98, .35); animation: breathe 1.6s ease-in-out infinite; }

/* round 2 (Gemini 8/10), Friday November 13 2026:
   5 the room count agrees (eyebrow, entrance, dots); 2 Best available and the AI pills are ONE wrapping row, no "Choose AIs" link,
   Paint under it; 3 Floor plan lives in the bottom bar on phones; the viewer opens bare */
.ask .ask-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; grid-template-columns: none; }
.ask .ask-bar .ai-pick { display: contents; }
.ask .ask-bar .ai-chip, .ask .ask-bar .ai-chip.best { flex: 0 1 auto; order: 1; grid-column: auto; grid-row: auto; min-height: 44px; }
.ask .ask-bar .ai-chip.capped { flex: 0 1 auto; }
.ask .ask-bar [data-send] { order: 5; flex: 1 1 100%; width: 100%; min-width: 0; justify-self: stretch; grid-column: auto; grid-row: auto; margin: 4px 0 0; }
.ask .ask-bar .ai-more.phone-apps { order: 6; flex: 1 1 100%; grid-column: auto; grid-row: auto; justify-self: stretch; }
.ask .ask-bar .ai-more.phone-apps summary { display: inline-flex; }
.dots i.plus { border-style: dashed; }
.dots { flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; gap: 6px 7px; max-width: 46vw; }
.dots::after { flex: 0 0 100%; text-align: center; content: "Floor plan"; font-size: .7rem; letter-spacing: .04em; color: var(--muted); text-decoration: underline; text-decoration-color: var(--goldline); text-underline-offset: 3px; }
button.dots { display: flex; }
@media (max-width: 700px), (orientation: landscape) and (max-height: 520px) { .site-header .plan-button { display: none; } }
/* M5: three frames, one tap, in the floor plan */
.frame-pick { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
.frame-pick span { color: var(--muted); font-size: .9rem; margin-right: 4px; }
.frame-pick button { min-height: 44px; padding: 8px 16px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; cursor: pointer; font: inherit; font-size: .92rem; }
.frame-pick button[aria-pressed="true"] { border-color: var(--goldline); background: #fffcf5; box-shadow: inset 0 0 0 1px var(--goldline); }
@media (prefers-color-scheme: dark) { .frame-pick button { background: var(--card); } .frame-pick button[aria-pressed="true"] { background: #2a251d; } }
</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the room</a>
  <header class="site-header"><a class="museum-name" href="#/">Art Museum</a><button class="plan-button" type="button" data-plan>Floor plan</button></header>
  <main id="main" tabindex="-1"></main>
  <nav class="walkbar" aria-label="Walk through the museum">
    <button type="button" class="walk prev" data-walk="-1" aria-label="Previous room"><span aria-hidden="true">&#8249;</span><em data-prev-name></em></button>
    <button type="button" class="dots" data-dots data-plan aria-label="Floor plan"></button>
    <button type="button" class="walk next" data-walk="1" aria-label="Next room"><em data-next-name></em><span aria-hidden="true">&#8250;</span></button>
  </nav>
  <dialog class="rename" aria-label="Name this room"><form method="dialog" class="rename-inner"><h2>Name this room</h2><p class="hint">Up to 3 words. Leave it empty and the AI names it.</p>
    <input type="text" maxlength="40" autocomplete="off" aria-label="Room name"><div class="ask-row"><button type="button" class="button primary" data-rename-save>Save</button><button type="button" class="button quiet" data-rename-cancel>Cancel</button></div></form></dialog>
  <dialog class="plan" aria-label="Floor plan"><button type="button" class="plan-x" data-plan-close aria-label="Close">&#215;</button><img class="plan-img" data-plan-img alt=""><div class="plan-inner"><h2>Floor plan</h2><div class="frame-pick" role="group" aria-label="Frame"><span>Frame</span><button type="button" data-frame-set="A" aria-pressed="true">Gold</button><button type="button" data-frame-set="B" aria-pressed="false">Walnut</button><button type="button" data-frame-set="C" aria-pressed="false">Black</button></div><ol data-plan-list></ol><div class="plan-all" data-plan-all></div>
    <button class="button" type="button" data-plan-close>Close</button></div></dialog>
  <dialog class="viewer" aria-label="Painting"><div class="viewer-stage"><img alt=""><span class="spin" aria-hidden="true"></span></div><button type="button" class="viewer-x" data-viewer-close aria-label="Close">&#215;</button><p class="viewer-hint" data-viewer-hint>Tap for details · swipe for the next</p><p class="room-tag" data-room-tag aria-live="polite"></p><div class="viewer-copy"><h2></h2><p class="view-nav" data-view-nav></p><p data-meta></p><p data-prompt-line></p>
    <div class="ask-row"><button class="button" type="button" data-ask-again>Ask again</button><button class="button" type="button" data-viewer-close>Close</button><button class="button quiet" type="button" data-remove>Remove</button></div></div></dialog>
  <div class="undo-bar" data-undo-bar role="status" aria-live="polite" hidden></div>
  <dialog class="peek" aria-label="The laptop's AI tab"><div class="peek-inner"><h2 data-peek-title>The laptop's AI tab</h2><img alt="Screenshot of the AI tab on the laptop"><p data-peek-meta></p>
    <div class="ask-row"><button class="button primary" type="button" data-peek-again>Look again</button><button class="button" type="button" data-peek-close>Close</button></div></div></dialog>
  <template id="ask-template"><form class="ask" data-ask autocomplete="off">
    <textarea name="prompt" data-prompt rows="2" maxlength="500" placeholder="What should hang here?" aria-label="What do you want on this wall?"></textarea>
    <div class="ask-bar"><label class="ai-chip best"><input type="checkbox" name="best" checked><span>Best available</span></label>
    <fieldset class="ai-pick"><legend class="sr">Which AI paints it</legend><label class="ai-chip" title="Gemini"><input type="checkbox" name="ai" value="gemini"><span>Gemini</span><small class="ai-cap" data-cap="gemini"></small></label><label class="ai-chip" title="ChatGPT"><input type="checkbox" name="ai" value="chatgpt"><span>ChatGPT</span><small class="ai-cap" data-cap="chatgpt"></small></label><label class="ai-chip" title="Bing Image Creator"><input type="checkbox" name="ai" value="bing"><span>Bing</span><small class="ai-cap" data-cap="bing"></small></label><label class="ai-chip" title="Copilot"><input type="checkbox" name="ai" value="copilot"><span>Copilot</span><small class="ai-cap" data-cap="copilot"></small></label></fieldset>
    <details class="ai-more phone-apps" data-phone-apps hidden><summary>Add from another app</summary><div class="phone-row">
      <button type="button" class="ai-chip" data-app="chatgpt_app">ChatGPT</button><button type="button" class="ai-chip" data-app="gemini_app">Gemini</button>
      <button type="button" class="ai-chip" data-app="meta_app">Meta AI</button><button type="button" class="ai-chip" data-app="copilot_app">Copilot</button>
      <button type="button" class="ai-chip" data-app="bing_app">Bing</button></div>
      <p class="hint" data-phone-hint>Your idea is copied. It opens inside the museum: paint it, hold the picture, Copy, close, then Paste picture.</p>
      <div class="ask-row"><button type="button" class="button" data-paste-pic>Paste picture</button>
      <label class="button add-pic">Pick picture<input type="file" accept="image/*" data-add-pic hidden></label></div></details>
    <button class="button primary" type="submit" data-send>Paint</button></div>
    <p class="status" data-ask-status role="status" aria-live="polite"></p></form></template>
